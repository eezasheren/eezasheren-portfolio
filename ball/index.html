<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Ball · Eeza Sheren</title>
<style>
  :root { --bg: #000; }
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    overscroll-behavior: none;
    -webkit-text-size-adjust: 100%;
    font-family: -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
  }
  canvas {
    display: block;
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    touch-action: none;              /* the finger plays, the page never scrolls */
    cursor: grab;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  canvas.grabbing { cursor: grabbing; }
  #hint {
    position: fixed;
    left: 0; right: 0;
    top: calc(22px + env(safe-area-inset-top));
    text-align: center;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: rgba(255,255,255,0.5);
    pointer-events: none;
    transition: opacity 0.8s;
  }
  #hint.gone { opacity: 0; }

  /* the frosted glass dock */
  .dock {
    position: fixed;
    left: 50%;
    bottom: calc(14px + env(safe-area-inset-bottom));
    transform: translateX(-50%);
    display: flex;
    align-items: stretch;
    gap: 2px;
    padding: 6px;
    border-radius: 26px;
    background: rgba(255,255,255,0.14);
    border: 1px solid rgba(255,255,255,0.38);
    box-shadow: 0 12px 32px rgba(0,0,0,0.22), inset 0 1px 0 rgba(255,255,255,0.4);
    -webkit-backdrop-filter: blur(20px) saturate(1.6);
    backdrop-filter: blur(20px) saturate(1.6);
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .dock button {
    appearance: none;
    border: 0;
    margin: 0;
    padding: 0;
    width: 64px;
    height: 56px;
    border-radius: 20px;
    background: transparent;
    color: #fff;
    font-family: inherit;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 3px;
    cursor: pointer;
    transition: background 0.2s, color 0.2s, transform 0.12s;
  }
  .dock button:active { transform: scale(0.94); }
  .dock button.on { background: #fff; color: var(--bg); }
  .dock .g { font-size: 22px; font-weight: 700; line-height: 1; }
  .dock .l { font-size: 9.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.85; }
  .dock .sep { width: 1px; margin: 10px 4px; background: rgba(255,255,255,0.35); }
  .dock button.mute { width: 50px; }
  .dock button.mute.off .g { opacity: 0.45; text-decoration: line-through; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint"></div>
<nav class="dock" id="dock" aria-label="Toys">
  <button data-toy="ball" class="on"><span class="g">o</span><span class="l">Ball</span></button>
  <button data-toy="spin"><span class="g">@</span><span class="l">Spin</span></button>
  <button data-toy="wrap"><span class="g">::</span><span class="l">Wrap</span></button>
  <button data-toy="band"><span class="g">~</span><span class="l">Band</span></button>
  <span class="sep"></span>
  <button class="mute" id="mute" aria-label="Sound"><span class="g">♪</span><span class="l">Sound</span></button>
</nav>

<script>
/* ============================================================
   SETTINGS. Change these freely.
   ============================================================ */
const SETTINGS = {
  // The words every toy is made of. Keep a separator at the end so the ring joins up.
  text: 'eeza sheren is a product designer who builds things people can touch · drag me, throw me, see what happens · ',
  textColor: '#ffffff',
  // Ball diameter as a share of the shorter side of the play area.
  size: 0.56,
  // Background colours the page cycles through on every hit, pop and twang.
  // Keep them dark or strong enough for white text to read.
  backgrounds: ['#000000', '#d52b1e', '#1f4bd8', '#0f8a5f', '#7b2cbf', '#e8590c', '#c2185b', '#1b1b4d', '#2f6f3e', '#8a6d00'],
  sound: true,       // sound on to begin with (the dock has a switch)
  // Ball
  gravity: 2400,     // pixels per second squared
  bounce: 0.8,       // side walls and ceiling: 1 = never loses height, 0 = thud
  floorSpring: 700,  // how firm the floor is: the ball presses in, flattens, and springs back
  floorDamping: 3.8, // how much bounce the floor takes away (higher = deader)
  maxPress: 0.55,    // deepest the ball can be pressed into the floor, as a share of its radius
  rollFriction: 0.985,
  maxThrow: 4200,    // cap on flick speed, pixels per second
  throwBoost: 1,     // multiplies the flick speed
  crumble: 1.0,      // how far the touching letters get pushed in on a floor jumble (0 = off)
  crumbleChance: 0.4, // share of floor hits that jumble the letters
  crumbleArc: 60,    // how much of the ball jumbles, in degrees either side of the spot that touched
  // Spinner: one to five words, one per arm
  spinWords: ['SPIN', 'TOUCH', 'PLAY'],
  spinDrag: 0.22,    // how quickly a spin dies down (higher = sooner)
  // Rubber band
  bandBalls: 3,      // balls sitting on the band to begin with (tap to add more, up to bandMaxBalls)
  bandMaxBalls: 12,
  bandPull: 0.6,     // how far the band can be pulled, as a share of its length
  font: '600 100px -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif',
  // On phones (shorter side under 700px) everything is smaller, so the same numbers feel heavy.
  // These replace the ones above there.
  phone: {
    gravity: 3800,
    floorSpring: 1500,
    floorDamping: 5.6,
    bounce: 0.84,
    maxThrow: 5600,
    throwBoost: 1.5,
  },
};
let live = SETTINGS;

// Let the text be swapped from the address bar: index.html?text=hello%20world
const fromUrl = new URLSearchParams(location.search).get('text');
if (fromUrl) SETTINGS.text = fromUrl.endsWith(' ') ? fromUrl : fromUrl + ' · ';

/* ============================================================
   Shared bits: canvas, colours, sound, buzz, ripples, text
   ============================================================ */
const TAU = Math.PI * 2;
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hintEl = document.getElementById('hint');
const dock = document.getElementById('dock');
let W = 0, H = 0, FLOOR = 0, dpr = 1;
let touched = false;
let ripples = [];
const clamp = (v, a, b) => Math.min(Math.max(v, a), b);
const rnd = (a, b) => a + Math.random() * (b - a);
const normAngle = a => Math.atan2(Math.sin(a), Math.cos(a));

// colours
let bg = { color: SETTINGS.backgrounds[0] };
let bgPrev = null, bgFadeStart = 0;
function newBackground() {
  if (SETTINGS.backgrounds.length < 2) return;
  let next;
  do { next = SETTINGS.backgrounds[Math.floor(Math.random() * SETTINGS.backgrounds.length)]; } while (next === bg.color);
  bgPrev = bg; bgFadeStart = performance.now();
  bg = { color: next };
  document.documentElement.style.background = next;
  document.documentElement.style.setProperty('--bg', next);
  document.body.style.background = next;
  const meta = document.querySelector('meta[name=theme-color]');
  if (meta) meta.content = next;
}
function paintBackground(now) {
  const fade = bgPrev ? Math.min(1, (now - bgFadeStart) / 260) : 1;
  if (bgPrev && fade < 1) {
    ctx.fillStyle = bgPrev.color; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = fade; ctx.fillStyle = bg.color; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
  } else {
    bgPrev = null;
    ctx.fillStyle = bg.color; ctx.fillRect(0, 0, W, H);
  }
}

// sound: tiny synthesised blips, no files. Browsers only allow sound after the first tap.
const Sound = {
  ctx: null, on: SETTINGS.sound,
  init() {
    if (!this.ctx) { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; this.ctx = new AC(); }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  },
  play(type, f0, f1, dur, gain) {
    if (!this.on || !this.ctx || this.ctx.state !== 'running') return;
    const c = this.ctx, t = c.currentTime;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f0, t);
    o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(gain, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(c.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
  thud(s)  { this.play('sine', 150, 45, 0.18, 0.08 + 0.3 * s); },
  knock(s) { this.play('triangle', 420, 160, 0.08, 0.05 + 0.15 * s); },
  tick(v)  { this.play('square', 2200, 1500, 0.012, 0.015 + 0.05 * v); },
  noise() {
    if (!this._noise) {
      const c = this.ctx, b = c.createBuffer(1, Math.floor(c.sampleRate * 0.15), c.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      this._noise = b;
    }
    return this._noise;
  },
  pop() {
    // a crisp little burst of air, like real bubble wrap
    if (!this.on || !this.ctx || this.ctx.state !== 'running') return;
    const c = this.ctx, t = c.currentTime;
    const src = c.createBufferSource(); src.buffer = this.noise();
    const f = c.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = rnd(1300, 3400); f.Q.value = 1.1;
    const g = c.createGain(); g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05);
    src.connect(f).connect(g).connect(c.destination); src.start(t); src.stop(t + 0.08);
    this.play('sine', rnd(200, 260), 90, 0.05, 0.12);
  },
  twang(st){ const f = 150 + st * 110; this.play('sawtooth', f * 1.6, f, 0.3, 0.1); this.play('triangle', f * 2.02, f * 1.97, 0.55, 0.07); },
  snap()   { this.play('square', 900, 80, 0.12, 0.18); },
  whir()   { this.play('sine', 320, 640, 0.14, 0.05); },
};
function buzz(ms) { if (touched && navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} } }

// hint at the top, once per toy
const hinted = {};
function showHint(key, text) {
  if (hinted[key]) { hintEl.classList.add('gone'); return; }
  hintEl.textContent = text;
  hintEl.classList.remove('gone');
}
function hideHint(key) { hinted[key] = true; hintEl.classList.add('gone'); }

// measure the sentence's letters at the base font size
function measureChars(chars) {
  ctx.font = SETTINGS.font;
  const base = parseFloat(SETTINGS.font.match(/(\d+(\.\d+)?)px/)[1]);
  const widths = chars.map(ch => ctx.measureText(ch).width);
  return { base, widths, total: widths.reduce((a, b) => a + b, 0) };
}
function fontAt(px) { return SETTINGS.font.replace(/(\d+(\.\d+)?)px/, px.toFixed(2) + 'px'); }

// the sentence wrapped exactly once round a ring of radius r
function ringLayout(r) {
  const chars = Array.from(SETTINGS.text);
  const { base, widths, total } = measureChars(chars);
  const k = total / base;
  const fontPx = (TAU * r) / (k + TAU * 0.55);
  const textRadius = r - fontPx * 0.55;
  const circumference = TAU * textRadius;
  const scale = fontPx / base;
  const letters = [];
  let run = 0;
  for (let i = 0; i < chars.length; i++) {
    const w = widths[i] * scale;
    const a = ((run + w / 2) / circumference) * TAU;
    run += w;
    if (chars[i] === ' ') continue;
    letters.push({ ch: chars[i], a, spread: rnd(-1, 1), depth: Math.random(), pull: rnd(0.55, 1), tilt: rnd(-2.2, 2.2) });
  }
  return { letters, fontPx, textRadius, font: fontAt(fontPx) };
}
function setText() {
  ctx.fillStyle = SETTINGS.textColor;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
}
function drawRipples(now) {
  for (let i = ripples.length - 1; i >= 0; i--) {
    const rp = ripples[i];
    const p = (now - rp.t) / 420;
    if (p >= 1) { ripples.splice(i, 1); continue; }
    ctx.beginPath();
    ctx.arc(rp.x, rp.y, rp.size * (0.2 + p * 0.8), 0, TAU);
    ctx.strokeStyle = SETTINGS.textColor;
    ctx.globalAlpha = (1 - p) * 0.5;
    ctx.lineWidth = 2 * (1 - p) + 0.5;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
}
function ripple(x, y, size) { ripples.push({ x, y, t: performance.now(), size }); }

/* ============================================================
   TOY 1: the ball
   ============================================================ */
const Ball = {
  key: 'ball',
  b: { x: 0, y: 0, r: 0, vx: 0, vy: 0, angle: 0, spin: 0, squashX: 1, squashY: 1, onGround: false, contact: false,
       crumble: 0, crumbleV: 0, hitX: 0, hitY: 1 },
  ring: null, dragging: false, grabDX: 0, grabDY: 0, trail: [], lastHit: 0, started: false,

  enter() { this.layout(); showHint(this.key, 'drag the ball and let go'); },
  layout() {
    const b = this.b;
    b.r = Math.min(W, FLOOR) * SETTINGS.size / 2;
    if (!this.started) { this.started = true; b.x = W / 2; b.y = -b.r - 20; b.vx = 0; b.vy = 0; }
    b.x = clamp(b.x, b.r, W - b.r);
    b.y = Math.min(b.y, FLOOR - b.r * (1 - SETTINGS.maxPress));
    this.ring = ringLayout(b.r);
  },
  hit(speed, nx, ny, px, py) {
    const now = performance.now();
    const strength = Math.min(1, speed / 2200);
    const b = this.b;
    if (speed > 90 && now - this.lastHit > 60) {
      this.lastHit = now;
      newBackground();
      ripple(px, py, b.r * (0.6 + strength));
      buzz(6 + Math.round(strength * 14));
      if (ny < 0) Sound.thud(strength); else Sound.knock(strength);
      const floor = ny < 0;
      if (floor && speed > 250 && Math.random() < SETTINGS.crumbleChance) {
        b.hitX = -nx; b.hitY = -ny;
        b.crumble = Math.max(b.crumble, (0.5 + strength * 0.6) * SETTINGS.crumble);
        b.crumbleV = 0;
      }
    }
    if (speed < 60 || ny < 0) return;          // the floor bends the ball instead of squashing it
    const s = 0.08 + strength * 0.22;
    if (ny !== 0) { b.squashY = 1 - s; b.squashX = 1 + s; }
    else          { b.squashX = 1 - s; b.squashY = 1 + s; }
  },
  step(dt) {
    const b = this.b;
    if (!this.dragging) {
      b.vy += live.gravity * dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.onGround = false;
      // floor: soft. The ball presses in, flattens, and the squeeze pushes it back up.
      const pen = b.y + b.r - FLOOR;
      if (pen > 0) {
        if (!b.contact) { b.contact = true; if (b.vy > 0) this.hit(b.vy, 0, -1, b.x, FLOOR); }
        b.vy += (-live.floorSpring * pen - live.floorDamping * b.vy) * dt;
        const deepest = b.r * SETTINGS.maxPress;
        if (pen > deepest) { b.y = FLOOR - b.r + deepest; if (b.vy > 0) b.vy = 0; }
        b.onGround = true;
      } else {
        b.contact = false;
      }
      if (b.y - b.r < 0) { b.y = b.r; if (b.vy < 0) { this.hit(-b.vy, 0, 1, b.x, 0); b.vy = -b.vy * live.bounce; } }
      if (b.x - b.r < 0) { b.x = b.r; if (b.vx < 0) { this.hit(-b.vx, 1, 0, 0, b.y); b.vx = -b.vx * live.bounce; } }
      if (b.x + b.r > W) { b.x = W - b.r; if (b.vx > 0) { this.hit(b.vx, -1, 0, W, b.y); b.vx = -b.vx * live.bounce; } }
      if (b.onGround) {
        b.vx *= Math.pow(SETTINGS.rollFriction, dt * 60);
        if (Math.abs(b.vx) < 4) b.vx = 0;
        b.spin = b.vx / b.r;
      } else {
        b.spin *= Math.pow(0.999, dt * 60);
      }
      b.angle += b.spin * dt;
    }
    b.squashX += (1 - b.squashX) * Math.min(1, dt * 14);
    b.squashY += (1 - b.squashY) * Math.min(1, dt * 14);
    // the jumble only lives while the ball is on the floor
    if (b.contact && !this.dragging) {
      b.crumbleV += (-60 * b.crumble - 7 * b.crumbleV) * dt;
      b.crumble += b.crumbleV * dt;
    } else {
      b.crumble -= b.crumble * Math.min(1, dt * 30);
      b.crumbleV = 0;
    }
    if (b.crumble < 0.002) { b.crumble = 0; b.crumbleV = 0; }
  },
  draw(now) {
    const b = this.b, { letters, fontPx, textRadius, font } = this.ring;
    const pressed = Math.max(0, (b.y + b.r - FLOOR) / b.r);
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.scale(b.squashX * (1 + pressed * 0.3), b.squashY);
    ctx.font = font; setText();
    const c = b.crumble * Math.min(1, pressed / 0.08);
    const acrossX = -b.hitY, acrossY = b.hitX;
    const arcCos = Math.cos(SETTINGS.crumbleArc * Math.PI / 180);
    const floorLocal = (FLOOR - b.y) / b.squashY - fontPx * 0.38;
    const band = fontPx * 1.2;
    for (const l of letters) {
      const ang = l.a + b.angle;
      const dx = Math.sin(ang), dy = -Math.cos(ang);
      let x = dx * textRadius, y = dy * textRadius, rot = ang;
      if (c !== 0) {
        const facing = dx * b.hitX + dy * b.hitY;
        let w = (facing - arcCos) / (1 - arcCos);
        if (w > 0) {
          w = w * w * (3 - 2 * w);
          const toWall = b.r * (0.72 + l.depth * 0.2);
          const side = dx * acrossX + dy * acrossY;
          const hx = b.hitX * toWall + acrossX * (l.spread * 0.6 + side * 0.5) * b.r * 0.9;
          const hy = b.hitY * toWall + acrossY * (l.spread * 0.6 + side * 0.5) * b.r * 0.9;
          const m = c * l.pull * w;
          x += (hx - x) * m; y += (hy - y) * m;
          rot += l.tilt * c * w;
        }
      }
      // the bend: anything that would be below the floor lies flat along it
      if (y > floorLocal - band) {
        const t = Math.min(1, (y - (floorLocal - band)) / band);
        if (y > floorLocal) y = floorLocal;
        rot += normAngle(Math.PI - rot) * t * t;
      }
      ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.fillText(l.ch, 0, 0); ctx.restore();
    }
    ctx.restore();
  },
  down(p) {
    const b = this.b, dx = p.x - b.x, dy = p.y - b.y;
    if (dx * dx + dy * dy > (b.r * 1.15) ** 2) return false;
    this.dragging = true;
    this.grabDX = b.x - p.x; this.grabDY = b.y - p.y;
    b.vx = 0; b.vy = 0; b.spin = 0;
    this.trail = [{ x: b.x, y: b.y, t: performance.now() }];
    return true;
  },
  move(p) {
    if (!this.dragging) return;
    const b = this.b;
    const nx = clamp(p.x + this.grabDX, b.r, W - b.r);
    const ny = clamp(p.y + this.grabDY, b.r, FLOOR - b.r * (1 - SETTINGS.maxPress));
    b.angle += (nx - b.x) / b.r * 0.6;
    b.x = nx; b.y = ny;
    const now = performance.now();
    this.trail.push({ x: nx, y: ny, t: now });
    while (this.trail.length > 2 && now - this.trail[0].t > 110) this.trail.shift();
  },
  up() {
    if (!this.dragging) return;
    this.dragging = false;
    const b = this.b, now = performance.now();
    const first = this.trail[0], lastP = this.trail[this.trail.length - 1];
    const dtS = Math.max((lastP.t - first.t) / 1000, 0.016);
    let vx = 0, vy = 0;
    if (now - lastP.t < 90 && this.trail.length > 1) {
      vx = (lastP.x - first.x) / dtS * live.throwBoost;
      vy = (lastP.y - first.y) / dtS * live.throwBoost;
      const speed = Math.hypot(vx, vy);
      if (speed > live.maxThrow) { vx *= live.maxThrow / speed; vy *= live.maxThrow / speed; }
      if (speed > 300) hideHint(this.key);
    }
    b.vx = vx; b.vy = vy; b.spin = vx / b.r * 0.8;
    this.trail = [];
  },
};

/* ============================================================
   TOY 2: the spinner. A fidget spinner whose arms are words.
   Flick it: the words blur into rings of light.
   ============================================================ */
const Spinner = {
  key: 'spin',
  angle: 0, w: 0, grab: false, lastA: 0, samples: [], tickAcc: 0, lastTick: 0, turns: 0,
  cx: 0, cy: 0, r: 0, fontPx: 0, font: '', words: [], hub: 0, gap: 0,
  enter() { this.layout(); this.w = 2.5; showHint(this.key, 'flick it round, hold to brake'); },
  layout() {
    this.r = Math.min(W, FLOOR) * SETTINGS.size / 2;
    this.cx = W / 2; this.cy = FLOOR / 2;
    this.words = SETTINGS.spinWords.slice(0, 5).map(w => String(w).toUpperCase());
    this.hub = this.r * 0.17;
    // the longest word runs from just outside the hub to just inside the rim
    ctx.font = SETTINGS.font;
    const widest = Math.max(...this.words.map(w => this.wordWidth(w, 100)));
    const room = this.r * 0.95 - this.hub * 1.5;
    this.fontPx = Math.min(room / (widest / 100), this.r * 0.3);
    this.font = fontAt(this.fontPx);
    this.gap = this.fontPx * 0.12;
  },
  wordWidth(word, px) {
    ctx.font = fontAt(px);
    let w = 0;
    for (const ch of word) w += ctx.measureText(ch).width + px * 0.12;
    return w - px * 0.12;
  },
  step(dt) {
    if (!this.grab) {
      const sign = Math.sign(this.w);
      let mag = Math.abs(this.w) * Math.exp(-SETTINGS.spinDrag * dt) - 0.5 * dt;
      if (mag < 0) mag = 0;
      this.w = sign * mag;
      this.angle += this.w * dt;
    }
    this.tickAcc += Math.abs(this.w) * dt;
    const stepA = TAU / 16;
    if (this.tickAcc >= stepA) {
      this.tickAcc %= stepA;
      const now = performance.now();
      if (now - this.lastTick > 35) { this.lastTick = now; Sound.tick(Math.min(1, Math.abs(this.w) / 15)); }
    }
    this.turns += Math.abs(this.w) * dt;
    if (this.turns >= TAU) { this.turns %= TAU; if (Math.abs(this.w) > 3) newBackground(); }
  },
  drawArms(a, alpha) {
    ctx.globalAlpha = alpha;
    const n = this.words.length;
    ctx.font = this.font;
    ctx.textAlign = 'left';
    for (let i = 0; i < n; i++) {
      ctx.save();
      ctx.rotate(a + i * TAU / n);
      let x = this.hub * 1.5;
      for (const ch of this.words[i]) {
        ctx.fillText(ch, x, 0);
        x += ctx.measureText(ch).width + this.gap;
      }
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  },
  draw() {
    ctx.save();
    ctx.translate(this.cx, this.cy);
    setText();
    const speed = Math.abs(this.w);
    const glow = clamp((speed - 2) / 22, 0, 1);
    // light: rings that brighten with speed
    if (glow > 0) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const disc = ctx.createRadialGradient(0, 0, this.hub, 0, 0, this.r * 1.05);
      disc.addColorStop(0, `rgba(255,255,255,${0.10 * glow})`);
      disc.addColorStop(0.55, `rgba(255,255,255,${0.16 * glow})`);
      disc.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = disc;
      ctx.beginPath(); ctx.arc(0, 0, this.r * 1.05, 0, TAU); ctx.fill();
      ctx.shadowColor = 'rgba(255,255,255,0.9)';
      ctx.shadowBlur = 18 * glow;
      ctx.lineCap = 'round';
      const rings = [0.42, 0.66, 0.9];
      rings.forEach((f, i) => {
        ctx.beginPath();
        // broken rings that turn with the spinner, like trails of light
        const sweep = 1.1 + glow * 2.2;
        const a0 = this.angle * (1 + i * 0.15);
        ctx.arc(0, 0, this.r * f, a0, a0 + sweep);
        ctx.lineWidth = this.fontPx * (0.35 + 0.25 * glow);
        ctx.strokeStyle = `rgba(255,255,255,${0.08 + 0.22 * glow})`;
        ctx.stroke();
      });
      ctx.restore();
    }
    // motion blur: trailing copies of the arms, closer together when slow
    const ghosts = speed > 3 ? Math.min(10, Math.ceil(speed / 2.5)) : 0;
    const spread = 0.03 + Math.min(0.09, speed / 400);
    for (let g = ghosts; g >= 1; g--) this.drawArms(this.angle - Math.sign(this.w) * g * spread, 0.55 / (g + 0.5));
    this.drawArms(this.angle, 1);
    // the hub
    ctx.save();
    ctx.shadowColor = 'rgba(255,255,255,0.8)'; ctx.shadowBlur = 10 + 20 * glow;
    ctx.beginPath(); ctx.arc(0, 0, this.hub, 0, TAU); ctx.fill();
    ctx.restore();
    ctx.fillStyle = bg.color;
    ctx.beginPath(); ctx.arc(0, 0, this.hub * 0.42, 0, TAU); ctx.fill();
    ctx.restore();
  },
  down(p) {
    if (Math.hypot(p.x - this.cx, p.y - this.cy) > this.r * 1.15) return false;
    this.grab = true;
    this.lastA = Math.atan2(p.y - this.cy, p.x - this.cx);
    this.samples = [];
    this.w = 0;
    return true;
  },
  move(p) {
    if (!this.grab) return;
    const a = Math.atan2(p.y - this.cy, p.x - this.cx);
    const d = normAngle(a - this.lastA);
    this.angle += d;
    this.lastA = a;
    const now = performance.now();
    this.samples.push({ d, t: now });
    while (this.samples.length > 1 && now - this.samples[0].t > 100) this.samples.shift();
  },
  up() {
    if (!this.grab) return;
    this.grab = false;
    const now = performance.now(), s = this.samples;
    let w = 0;
    if (s.length > 1 && now - s[s.length - 1].t < 90) {
      const span = Math.max((s[s.length - 1].t - s[0].t) / 1000, 0.016);
      let sum = 0; for (let i = 1; i < s.length; i++) sum += s[i].d;
      w = clamp(sum / span, -70, 70);
    }
    this.w = w;
    if (Math.abs(w) > 4) { newBackground(); Sound.whir(); buzz(8); hideHint(this.key); }
    this.samples = [];
  },
};

/* ============================================================
   TOY 3: bubble wrap. Frosted glass bubbles over soft 3D shapes.
   ============================================================ */
const Wrap = {
  key: 'wrap',
  bubbles: [], D: 0, allPoppedAt: 0, pops: 0, blobs: [], lo: null, loCtx: null, mid: null, midCtx: null,
  enter() {
    this.layout();
    if (!this.blobs.length) this.makeBlobs();
    this.inflate();
    showHint(this.key, 'pop them');
  },
  layout() {
    const N = 20;
    const top = 60, areaH = FLOOR - top - 8;
    let best = { D: 0, cols: 1, rows: 1 };
    for (let cols = 2; cols <= 8; cols++) {
      const rows = Math.ceil(N / cols);
      const D = Math.min(W / cols, areaH / rows);
      if (D > best.D) best = { D, cols, rows };
    }
    const cell = best.D;
    this.D = cell * 0.9;
    const gridW = best.cols * cell, gridH = best.rows * cell;
    const ox = (W - gridW) / 2 + cell / 2, oy = top + (areaH - gridH) / 2 + cell / 2;
    const old = this.bubbles.length === N ? this.bubbles : null;
    this.bubbles = [];
    for (let i = 0; i < N; i++) this.bubbles.push({
      x: ox + (i % best.cols) * cell, y: oy + Math.floor(i / best.cols) * cell,
      popped: old ? old[i].popped : false, born: old ? old[i].born : 0, phase: rnd(0, TAU),
    });
    // the blurred copy of the scene that shows through the glass
    this.lo = this.lo || document.createElement('canvas');
    this.lo.width = Math.max(8, Math.round(W / 10)); this.lo.height = Math.max(8, Math.round(H / 10));
    this.loCtx = this.lo.getContext('2d');
    this.mid = this.mid || document.createElement('canvas');
    this.mid.width = Math.round(W * dpr); this.mid.height = Math.round(H * dpr);
    this.midCtx = this.mid.getContext('2d');
  },
  makeBlobs() {
    // soft, glossy pebbles that drift slowly behind the glass
    this.blobs = [];
    for (let i = 0; i < 7; i++) {
      this.blobs.push({ x: rnd(0.05, 0.95), y: rnd(0.05, 0.85), rx: rnd(0.12, 0.26), ry: rnd(0.07, 0.16),
        rot: rnd(0, Math.PI), vx: rnd(-0.012, 0.012), vy: rnd(-0.008, 0.008), vr: rnd(-0.08, 0.08), shade: rnd(0.3, 0.6) });
    }
  },
  drawBlobs(c, scale) {
    const w = W * scale, h = H * scale, base = Math.min(W, H) * scale;
    for (const b of this.blobs) {
      const rx = b.rx * base, ry = b.ry * base;
      c.save();
      c.translate(b.x * w, b.y * h);
      c.rotate(b.rot);
      const g = c.createRadialGradient(-rx * 0.35, -ry * 0.45, 0, 0, 0, rx);
      g.addColorStop(0, 'rgba(255,255,255,0.85)');
      g.addColorStop(0.3, 'rgba(255,255,255,0.35)');
      g.addColorStop(0.75, `rgba(0,0,0,${b.shade * 0.5})`);
      g.addColorStop(1, `rgba(0,0,0,${b.shade})`);
      c.fillStyle = g;
      c.beginPath(); c.ellipse(0, 0, rx, ry, 0, 0, TAU); c.fill();
      c.restore();
    }
  },
  inflate() {
    const now = performance.now();
    this.bubbles.forEach((b, i) => { b.popped = false; b.born = now + i * 35; });
    this.allPoppedAt = 0;
  },
  step(dt) {
    for (const b of this.blobs) {
      b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.vr * dt;
      if (b.x < -0.1 || b.x > 1.1) b.vx = -b.vx;
      if (b.y < -0.1 || b.y > 1.0) b.vy = -b.vy;
    }
    if (this.allPoppedAt && performance.now() - this.allPoppedAt > 1500) this.inflate();
  },
  draw(now) {
    // the sharp scene
    this.drawBlobs(ctx, 1);
    // the blurred scene: drawn small, then scaled up (and blurred where the browser can)
    const lo = this.loCtx, mid = this.midCtx;
    lo.setTransform(1, 0, 0, 1, 0, 0);
    lo.fillStyle = bg.color; lo.fillRect(0, 0, this.lo.width, this.lo.height);
    lo.save(); lo.scale(this.lo.width / W, this.lo.height / H); this.drawBlobs(lo, 1); lo.restore();
    mid.setTransform(dpr, 0, 0, dpr, 0, 0);
    mid.imageSmoothingEnabled = true; mid.imageSmoothingQuality = 'high';
    if ('filter' in mid) mid.filter = 'blur(8px)';
    mid.drawImage(this.lo, -12, -12, W + 24, H + 24);
    if ('filter' in mid) mid.filter = 'none';

    const R = this.D / 2;
    for (const b of this.bubbles) {
      if (b.popped) {
        // a popped cell lies flat: a faint ring on the sharp scene
        ctx.beginPath(); ctx.arc(b.x, b.y, R * 0.96, 0, TAU);
        ctx.fillStyle = 'rgba(0,0,0,0.07)'; ctx.fill();
        ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.stroke();
        continue;
      }
      const age = (now - b.born) / 380;
      if (age < 0) continue;
      let s;
      if (age < 1) { const k = 1 - age; s = Math.max(0, 1 - k * k * Math.cos(age * 9)); }
      else s = 1 + 0.015 * Math.sin(now / 700 + b.phase);
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.scale(s, s);
      ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU);
      ctx.save();
      ctx.clip();
      // frosted: the blurred scene, lightened
      ctx.drawImage(this.mid, 0, 0, this.mid.width, this.mid.height, -b.x, -b.y, W, H);
      ctx.fillStyle = 'rgba(255,255,255,0.22)'; ctx.fillRect(-R, -R, R * 2, R * 2);
      // depth: light from the top left, a shadow along the bottom edge
      const hi = ctx.createRadialGradient(-R * 0.4, -R * 0.45, 0, -R * 0.2, -R * 0.2, R * 1.1);
      hi.addColorStop(0, 'rgba(255,255,255,0.45)'); hi.addColorStop(0.5, 'rgba(255,255,255,0.05)'); hi.addColorStop(1, 'rgba(0,0,0,0.10)');
      ctx.fillStyle = hi; ctx.fillRect(-R, -R, R * 2, R * 2);
      ctx.restore();
      ctx.lineWidth = 1.2; ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.stroke();
      // a crisp little highlight
      ctx.beginPath(); ctx.ellipse(-R * 0.38, -R * 0.42, R * 0.2, R * 0.11, -0.7, 0, TAU);
      ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.fill();
      ctx.restore();
    }
  },
  popAt(p) {
    const R = this.D / 2 * 0.95, now = performance.now();
    for (const b of this.bubbles) {
      if (b.popped || now < b.born + 150) continue;
      if (Math.hypot(p.x - b.x, p.y - b.y) > R) continue;
      b.popped = true;
      ripple(b.x, b.y, this.D * 0.8);
      Sound.pop(); buzz(5);
      this.pops++;
      if (this.pops % 3 === 0) newBackground();
      hideHint(this.key);
      if (this.bubbles.every(x => x.popped)) this.allPoppedAt = now;
    }
  },
  down(p) {
    if (this.allPoppedAt) { this.inflate(); return true; }
    this.popAt(p);
    return true;
  },
  move(p) { this.popAt(p); },
  up() {},
};

/* ============================================================
   TOY 4: the rubber band. Words strung between two pegs, with
   balls riding on it. Pull and let go: the balls jump.
   ============================================================ */
const Band = {
  key: 'band',
  A: null, B: null, R: null, P: null, V: null, Pprev: null, Vp: { x: 0, y: 0 }, L0: 0,
  chars: [], widths: [], textW: 0, fontPx: 0, font: '',
  pts: [], cum: [], total: 0,
  grab: false, t0: 0.5, off: null,
  balls: [], ballR: 16, nextLetter: 0,
  enter() {
    this.layout();
    this.P = { x: this.R.x, y: this.R.y + Math.min(60, FLOOR * 0.08) };
    this.V = { x: 0, y: 0 };
    this.Pprev = { x: this.P.x, y: this.P.y };
    this.balls = [];
    this.curve();
    const n = SETTINGS.bandBalls;
    for (let i = 0; i < n; i++) {
      const f = (i + 1) / (n + 1);
      const q = this.at(this.total * f);
      this.addBall(q.x, q.y - this.ballR * 1.5);
    }
    showHint(this.key, 'pull it and let go · tap to add a ball');
  },
  layout() {
    const pad = Math.max(28, W * 0.09);
    this.A = { x: pad, y: FLOOR * 0.5 };
    this.B = { x: W - pad, y: FLOOR * 0.5 };
    this.R = { x: (this.A.x + this.B.x) / 2, y: this.A.y };
    this.L0 = this.B.x - this.A.x;
    // readable letters: as many words of the sentence as fit between the pegs at this size
    this.fontPx = clamp(W * 0.028, 13, 24);
    this.font = fontAt(this.fontPx);
    ctx.font = this.font;
    const all = SETTINGS.text.trim().split(/\s+/);
    const words = [];
    let width = 0;
    for (const w of all) {
      const ww = ctx.measureText((words.length ? ' ' : '') + w).width;
      if (width + ww > this.L0 * 0.92) break;
      words.push(w); width += ww;
    }
    if (!words.length) words.push(all[0]);
    while (words.length > 1 && /^[·\-•]$/.test(words[words.length - 1])) words.pop();
    this.chars = Array.from(words.join(' '));
    this.widths = this.chars.map(ch => ctx.measureText(ch).width);
    this.textW = this.widths.reduce((a, b) => a + b, 0);
    this.ballR = clamp(this.fontPx * 1.1, 14, 26);
    if (!this.P) { this.P = { x: this.R.x, y: this.R.y }; this.V = { x: 0, y: 0 }; }
    else { this.P.x = clamp(this.P.x, 0, W); this.P.y = clamp(this.P.y, 0, FLOOR); }
    for (const b of this.balls) { b.x = clamp(b.x, this.ballR, W - this.ballR); b.y = Math.min(b.y, FLOOR - this.ballR); }
  },
  addBall(x, y) {
    if (this.balls.length >= SETTINGS.bandMaxBalls) return;
    const letters = Array.from(SETTINGS.text).filter(ch => /\S/.test(ch) && ch !== '·' && ch !== '-' && ch !== '•' && ch !== ',' && ch !== '.');
    const ch = letters[this.nextLetter++ % letters.length];
    this.balls.push({ x, y, vx: 0, vy: 0, ch });
  },
  curve() {
    const A = this.A, B = this.B, P = this.P;
    const C = { x: 2 * P.x - (A.x + B.x) / 2, y: 2 * P.y - (A.y + B.y) / 2 };
    const n = 48;
    this.pts = []; this.cum = [0];
    for (let i = 0; i <= n; i++) {
      const t = i / n, u = 1 - t;
      const x = u * u * A.x + 2 * u * t * C.x + t * t * B.x;
      const y = u * u * A.y + 2 * u * t * C.y + t * t * B.y;
      this.pts.push({ x, y });
      if (i > 0) { const q = this.pts[i - 1]; this.cum.push(this.cum[i - 1] + Math.hypot(x - q.x, y - q.y)); }
    }
    this.total = this.cum[n];
  },
  at(s) {
    const cum = this.cum, pts = this.pts;
    let lo = 0, hi = cum.length - 1;
    while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (cum[mid] <= s) lo = mid; else hi = mid; }
    const seg = Math.max(cum[hi] - cum[lo], 0.0001);
    const f = clamp((s - cum[lo]) / seg, 0, 1);
    const a = pts[lo], b = pts[hi];
    return { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f, rot: Math.atan2(b.y - a.y, b.x - a.x) };
  },
  letterPositions() {
    this.curve();
    const k = this.total / this.L0;
    const start = (this.total - this.textW * k) / 2;
    const out = [];
    let run = 0;
    for (let i = 0; i < this.chars.length; i++) {
      const w = this.widths[i];
      if (this.chars[i] !== ' ') {
        const q = this.at(start + (run + w / 2) * k);
        out.push({ ch: this.chars[i], x: q.x, y: q.y, rot: q.rot });
      }
      run += w;
    }
    return out;
  },
  step(dt) {
    if (!this.grab) {
      const k = 170, c = 4.5;
      this.V.x += (-k * (this.P.x - this.R.x) - c * this.V.x) * dt;
      this.V.y += (-k * (this.P.y - this.R.y) - c * this.V.y) * dt;
      this.P.x += this.V.x * dt; this.P.y += this.V.y * dt;
      if (Math.hypot(this.V.x, this.V.y) < 2 && Math.hypot(this.P.x - this.R.x, this.P.y - this.R.y) < 0.5) {
        this.P.x = this.R.x; this.P.y = this.R.y; this.V.x = 0; this.V.y = 0;
      }
    }
    // how fast the pull point is moving right now (dragged or springing)
    const sdt = Math.max(dt, 0.001);
    this.Vp = { x: (this.P.x - this.Pprev.x) / sdt, y: (this.P.y - this.Pprev.y) / sdt };
    this.Pprev = { x: this.P.x, y: this.P.y };
    this.curve();

    const r = this.ballR, n = this.pts.length - 1;
    for (const b of this.balls) {
      b.vy += live.gravity * dt;
      b.x += b.vx * dt; b.y += b.vy * dt;
      // walls and floor
      if (b.x < r) { b.x = r; b.vx = -b.vx * 0.5; }
      if (b.x > W - r) { b.x = W - r; b.vx = -b.vx * 0.5; }
      if (b.y > FLOOR - r) { b.y = FLOOR - r; if (b.vy > 0) b.vy = -b.vy * 0.35; b.vx *= 0.98; if (Math.abs(b.vy) < 30) b.vy = 0; }
      if (b.y < r) { b.y = r; if (b.vy < 0) b.vy = -b.vy * 0.5; }
      // the band: find the nearest point of the curve
      let bi = 0, bd = Infinity;
      for (let i = 0; i <= n; i++) { const q = this.pts[i]; const d = (q.x - b.x) ** 2 + (q.y - b.y) ** 2; if (d < bd) { bd = d; bi = i; } }
      if (bi === 0 || bi === n) continue;                 // off the end of the band
      const q = this.pts[bi], q0 = this.pts[bi - 1], q1 = this.pts[bi + 1];
      let tx = q1.x - q0.x, ty = q1.y - q0.y; const tl = Math.hypot(tx, ty) || 1; tx /= tl; ty /= tl;
      let nx = -ty, ny = tx; if (ny > 0) { nx = -nx; ny = -ny; }   // normal pointing up, away from the band
      const d = (b.x - q.x) * nx + (b.y - q.y) * ny;        // how far above the band the centre is
      if (d < r && d > -r * 1.2) {
        b.x += nx * (r - d); b.y += ny * (r - d);
        const t = bi / n, u = 1 - t;
        const bvx = 4 * u * t * this.Vp.x, bvy = 4 * u * t * this.Vp.y;   // the band's own speed here
        const vn = (b.vx - bvx) * nx + (b.vy - bvy) * ny;
        if (vn < 0) {
          const e = 0.45;
          b.vx -= nx * vn * (1 + e); b.vy -= ny * vn * (1 + e);
          if (vn < -250) { Sound.knock(Math.min(1, -vn / 1500)); }
        }
        // rolling along the band loses a little speed
        const vt = b.vx * tx + b.vy * ty;
        b.vx -= tx * vt * 0.01; b.vy -= ty * vt * 0.01;
      }
    }
    // balls don't overlap
    for (let i = 0; i < this.balls.length; i++) for (let j = i + 1; j < this.balls.length; j++) {
      const a = this.balls[i], c = this.balls[j];
      const dx = c.x - a.x, dy = c.y - a.y, d = Math.hypot(dx, dy) || 0.001;
      if (d < r * 2) {
        const push = (r * 2 - d) / 2, ux = dx / d, uy = dy / d;
        a.x -= ux * push; a.y -= uy * push; c.x += ux * push; c.y += uy * push;
        const rv = (c.vx - a.vx) * ux + (c.vy - a.vy) * uy;
        if (rv < 0) { a.vx += ux * rv * 0.5; a.vy += uy * rv * 0.5; c.vx -= ux * rv * 0.5; c.vy -= uy * rv * 0.5; }
      }
    }
  },
  draw() {
    ctx.save();
    ctx.font = this.font; setText();
    for (const peg of [this.A, this.B]) {
      ctx.beginPath(); ctx.arc(peg.x, peg.y, Math.max(3, this.fontPx * 0.18), 0, TAU); ctx.fill();
    }
    for (const l of this.letterPositions()) {
      ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(l.rot); ctx.fillText(l.ch, 0, 0); ctx.restore();
    }
    // the balls: white, with a letter in the page colour
    ctx.font = fontAt(this.ballR * 1.15);
    for (const b of this.balls) {
      ctx.fillStyle = SETTINGS.textColor;
      ctx.beginPath(); ctx.arc(b.x, b.y, this.ballR, 0, TAU); ctx.fill();
      ctx.fillStyle = bg.color;
      ctx.fillText(b.ch, b.x, b.y + this.ballR * 0.05);
    }
    ctx.restore();
  },
  down(p) {
    this.curve();
    let best = -1, bd = Infinity;
    this.pts.forEach((q, i) => { const d = Math.hypot(q.x - p.x, q.y - p.y); if (d < bd) { bd = d; best = i; } });
    if (bd <= Math.max(44, this.fontPx * 1.6)) {
      this.grab = true;
      this.t0 = clamp(best / (this.pts.length - 1), 0.12, 0.88);
      this.off = { x: this.pts[best].x - p.x, y: this.pts[best].y - p.y };
      this.V = { x: 0, y: 0 };
      return true;
    }
    // anywhere else: a new ball drops in
    if (p.y < FLOOR - this.ballR) { this.addBall(clamp(p.x, this.ballR, W - this.ballR), p.y); hideHint(this.key); Sound.knock(0.2); }
    return false;
  },
  move(p) {
    if (!this.grab) return;
    const A = this.A, B = this.B, t = this.t0, u = 1 - t;
    const Q = { x: p.x + this.off.x, y: p.y + this.off.y };
    const C = { x: (Q.x - u * u * A.x - t * t * B.x) / (2 * u * t), y: (Q.y - u * u * A.y - t * t * B.y) / (2 * u * t) };
    let px = (A.x + 2 * C.x + B.x) / 4, py = (A.y + 2 * C.y + B.y) / 4;
    // the band only stretches so far: past that it holds
    const maxPull = this.L0 * SETTINGS.bandPull;
    const dx = px - this.R.x, dy = py - this.R.y, d = Math.hypot(dx, dy);
    if (d > maxPull) { px = this.R.x + dx / d * maxPull; py = this.R.y + dy / d * maxPull; }
    px = clamp(px, A.x + this.L0 * 0.2, B.x - this.L0 * 0.2);
    py = clamp(py, 16, FLOOR - 16);
    this.P = { x: px, y: py };
  },
  up() {
    if (!this.grab) return;
    this.grab = false;
    this.curve();
    const stretch = this.total / this.L0;
    if (stretch > 1.06) { Sound.twang(stretch); buzz(10); newBackground(); hideHint(this.key); }
    this.V = { x: 0, y: 0 };
  },
};

/* ============================================================
   Switching toys, the dock, the sound switch
   ============================================================ */
const TOYS = { ball: Ball, spin: Spinner, wrap: Wrap, band: Band };
let toy = null;
function setToy(name) {
  if (toy && toy.up) toy.up();
  toy = TOYS[name];
  canvas.classList.remove('grabbing');
  toy.enter();
  dock.querySelectorAll('button[data-toy]').forEach(b => b.classList.toggle('on', b.dataset.toy === name));
}
dock.querySelectorAll('button[data-toy]').forEach(b => b.addEventListener('click', () => { Sound.init(); setToy(b.dataset.toy); }));
const muteBtn = document.getElementById('mute');
function showMute() { muteBtn.classList.toggle('off', !Sound.on); muteBtn.querySelector('.l').textContent = Sound.on ? 'Sound' : 'Muted'; }
muteBtn.addEventListener('click', () => { Sound.on = !Sound.on; if (Sound.on) Sound.init(); showMute(); });
showMute();

/* ============================================================
   Pointer input (mouse, pen and touch) and the frame loop
   ============================================================ */
function pointerPos(e) { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
let activePointer = null;
canvas.addEventListener('pointerdown', e => {
  if (activePointer !== null) return;              // one finger at a time
  touched = true;
  Sound.init();
  const p = pointerPos(e);
  if (!toy.down(p)) return;
  e.preventDefault();
  activePointer = e.pointerId;
  canvas.classList.add('grabbing');
  try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
});
canvas.addEventListener('pointermove', e => {
  if (e.pointerId !== activePointer) return;
  e.preventDefault();
  toy.move(pointerPos(e));
});
function release(e) {
  if (e.pointerId !== activePointer) return;
  activePointer = null;
  canvas.classList.remove('grabbing');
  try { canvas.releasePointerCapture(e.pointerId); } catch (err) {}
  toy.up(pointerPos(e));
}
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);
canvas.addEventListener('lostpointercapture', release);
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 3);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  live = Math.min(W, H) < 700 ? Object.assign({}, SETTINGS, SETTINGS.phone) : SETTINGS;
  // the play area ends where the dock begins
  const top = dock.getBoundingClientRect().top;
  FLOOR = top > 100 ? top - 10 : H;
  if (toy) toy.layout();
}

let last = performance.now();
function frame(now) {
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 1 / 30) dt = 1 / 30;
  toy.step(dt);
  paintBackground(now);
  drawRipples(now);
  toy.draw(now);
  requestAnimationFrame(frame);
}

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
document.addEventListener('visibilitychange', () => { last = performance.now(); });

resize();
setToy('ball');
requestAnimationFrame(frame);
</script>
</body>
</html>
